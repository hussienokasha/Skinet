<div class="min-h-screen bg-slate-50 px-4 py-10 sm:px-6 lg:px-8">
  <div class="mx-auto flex max-w-5xl items-center justify-center">
    <div class="w-full overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl shadow-slate-200/70">
      <div class="grid min-h-160 md:grid-cols-2">
        <div class="flex flex-col justify-between bg-slate-900 p-8 text-white sm:p-10 lg:p-12">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.35em] text-slate-300">Skinet</p>
            <h1 class="mt-6 text-3xl font-semibold sm:text-4xl">Welcome back</h1>
            <p class="mt-3 max-w-md text-sm leading-6 text-slate-300 sm:text-base">
              Sign in to continue exploring your favorite products and track your orders.
            </p>
          </div>
          <div class="mt-8 rounded-2xl border border-white/10 bg-white/10 p-4 backdrop-blur-sm">
            <p class="text-sm text-slate-200">New here?</p>
            <p class="mt-1 text-lg font-medium">Create an account in just a few clicks.</p>
          </div>
        </div>

        <div class="flex items-center justify-center p-6 sm:p-8 lg:p-12">
          <div class="w-full max-w-md">
            <div class="mb-8">
              <p class="text-sm font-semibold uppercase tracking-[0.35em] text-sky-600">Login</p>
              <h2 class="mt-2 text-2xl font-semibold text-slate-900 sm:text-3xl">Sign in to your account</h2>
            </div>

            <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()" >
              <div>
                <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email address</label>
                <input
                  id="email"
                 formControlName="email"
                  type="email"
                  placeholder="you@example.com"
                  class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
                />
              </div>

              <div>
                <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
                <input
                  id="password"
                   formControlName="password"
                  type="password"
                  placeholder="Enter your password"
                  class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
                />
              </div>

              <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-slate-600">
                  <input type="checkbox" class="h-4 w-4 rounded border-slate-300 text-sky-600 focus:ring-sky-500" />
                  Remember me
                </label>
                <a href="#" class="font-medium text-sky-600 transition hover:text-sky-700">Forgot password?</a>
              </div>

              <button
                type="submit"
                [disabled]="!loginForm.valid"
                class="w-full rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800 disabled:bg-gray-500"
              >
                Sign in
              </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-600">
              Don't have an account?
              <a routerLink="/signup" class="ml-1 font-semibold text-sky-600 transition hover:text-sky-700">Create one</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
