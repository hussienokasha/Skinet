@if (product().id) {
  <div class="container mx-auto mt-10">
    <div class="flex justify-center items-center gap-10">
      <img
        src="assets{{ product().pictureUrl }}"
        alt="{{ product().name }}"
        class="rounded-md aspect-square h-100"
      />
      <div class="w-1/2">
        <h2 class="text-2xl font-semibold mb-2 text-black">{{ product().name }}</h2>
        <p class="text-gray-600 mb-4 line-clamp-2" [title]="product().description">
          {{ product().description }}
        </p>
        <p class="text-blue-500 font-bold text-lg">{{ product().price | currency }}</p>
        <div class="mt-6">
          <label for="quantity" class="block text-sm font-medium text-gray-700 mb-2">Quantity</label>
          <div class="flex flex-wrap items-center gap-3">
            <input
              id="quantity"
              type="number"
              min="1"
              [value]="quantity()"
              (input)="quantity.set(+$any($event.target).value)"
              class="w-24 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button
              (click)="addToCart()"
              type="button"
              class="mt-2 sm:mt-0 inline-flex items-center gap-2 bg-blue-600 text-white py-2 px-5 rounded-lg shadow-sm hover:bg-blue-700 transition-colors duration-300"
            >
              <i class="fa-solid fa-basket-shopping"></i>
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
