<div class="container mx-auto">
  <div class="flex gap-2 items-center justify-between m-4">
    <form action="" class="flex gap-2 items-center" (submit)="onSearch()">
      <input
        type="text"
        class="border py-2 px-4 rounded"
        placeholder="Search..."
        [formControl]="searchTerm"
        name="search"
      />
      <button
        type="submit"
        class="border text-blue-500 py-2 px-4 rounded hover:bg-blue-600 hover:text-white transition-colors duration-300"
      >
        Search
      </button>
    </form>
    <button
      (click)="showFilterDialog()"
      class="border flex items-center ms-auto border-blue-600 text-blue-600 py-2 px-4 rounded hover:bg-blue-600 hover:text-white transition-colors duration-300"
    >
      Filter <i class="fa-solid fa-filter"></i>
    </button>
    <p-select
      (onChange)="onSortChange($event)"
      [options]="sortOptions"
      [(ngModel)]="shopParams.sort"
      optionLabel="label"
      optionValue="value"
      placeholder="Sort"
    />
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
    @for (product of products().data; track product.id) {
      <div
        [routerLink]="['/shop', product.id]"
        class="bg-white rounded-lg shadow-xl p-4 hover:shadow-2xl ring-1 ring-gray-300 hover:-translate-y-2 transition duration-300 cursor-pointer"
      >
        <img
          src="assets{{ product.pictureUrl }}"
          alt="{{ product.name }}"
          class="w-full rounded-md mb-4 aspect-square"
        />
        <h2 class="text-md font-semibold mb-2">{{ product.name }}</h2>
        <!-- <p class="text-gray-600 mb-4 line-clamp-2" [title]="product.description">{{product.description}}</p> -->
        <p class="text-blue-500 font-bold text-lg">{{ product.price | currency }}</p>
        <button
          type="button"
          (click)="$event.stopPropagation(); addToCart(product)"
          class="mt-4 w-full border cursor-pointer text-blue-500 py-2 px-4 rounded hover:bg-blue-600 hover:text-white transition-colors duration-300"
        >
          <i class="fa-solid fa-basket-shopping"></i>
          Add to Cart
        </button>
      </div>
    }
  </div>
  <div class="flex justify-center">
    <p-paginator
      (onPageChange)="onPageChange($event)"
      [first]="(shopParams.pageIndex - 1) * shopParams.pageSize"
      [rows]="shopParams.pageSize"
      [totalRecords]="products().count"
      [rowsPerPageOptions]="[5, 10, 20]"
    />
  </div>
</div>
