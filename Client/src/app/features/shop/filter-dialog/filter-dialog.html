
<div class="flex">
  <div class="w-1/2">
    <h3 class="text-lg font-semibold mb-2">Brands</h3>
    <ul>
      @for (brand of brands(); track brand) {
        <li class="mb-1">
          <label class="inline-flex items-center">
            <p-checkbox [(ngModel)]="selectedBrands" [value]="brand" />
            <span class="ml-2">{{ brand }}</span>
          </label>
        </li>
      }
    </ul>
  </div>

  <div class="w-1/2">
    <h3 class="text-lg font-semibold mb-2">Types</h3>
    <ul>
      @for (type of types(); track type) {
        <li class="mb-1">
          <label class="inline-flex items-center">
           <p-checkbox [(ngModel)]="selectedTypes" [value]="type" />
            <span class="ml-2">{{ type }}</span>
          </label>
        </li>
      }
    </ul>
  </div>
</div>
  <button
    (click)="applyFilters()"
    type="button"
    class="mt-4 w-full border text-blue-500 py-2 px-4 rounded hover:bg-blue-600 hover:text-white transition-colors duration-300"
  >
    Apply Filters
  </button>
